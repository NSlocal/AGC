name: Build & Release APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Debug — List files
        run: |
          ls -la
          ls -la app/
      
      - name: Debug — Check Gradle files
        run: |
          cat build.gradle
          echo "---"
          cat settings.gradle
          echo "---"
          cat app/build.gradle

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace 2>&1
        continue-on-error: false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SafetyCore-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          
