# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# === FIX: Timeout untuk koneksi lambat ===
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.org.gradle.internal.http.maxRetryAttempts=5

# === Mirror repo lebih cepat & stabil ===
mavenMirrorUrl=https://maven.aliyun.com/repository/google
mavenCentralMirrorUrl=https://maven.aliyun.com/repository/central
