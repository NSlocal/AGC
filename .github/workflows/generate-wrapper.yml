name: Generate Gradle Wrapper
on: workflow_dispatch

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          sudo apt update
          sudo apt install -y unzip
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "GRADLE_HOME=$PWD/gradle-8.2" >> $GITHUB_ENV

      - name: Generate Gradle Wrapper files
        run: |
          mkdir -p gradle/wrapper
          ./gradle-8.2/bin/gradle wrapper --gradle-version 8.2
          ls -la gradle/wrapper/

      - name: Commit & Push Wrapper files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/
          git commit -m "✅ Auto-add Gradle Wrapper files"
          git push || echo "⚠️ Push failed — upload manual file .jar saja"
          
