name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Set Permissions
        run: chmod +x gradlew

      - name: 🛠️ Build APK
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace --info

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
