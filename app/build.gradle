plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.google.android.safetycore'
    compileSdk 34

    defaultConfig {
        applicationId "com.google.android.safetycore"
        minSdk 34
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-rules.pro')
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // ==============================================
    // ✅ ANDROID CORE
    // ==============================================
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ==============================================
    // ✅ MATERIAL DESIGN 3 — UI KOMPONEN
    // ==============================================
    implementation 'com.google.android.material:material:1.11.0'

    // ==============================================
    // ✅ LIFECYCLE — ARSITEKTUR MODERN
    // ==============================================
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'

    // ==============================================
    // ✅ COROUTINES — ASYNCHRONOUS (Update Checker)
    // ==============================================
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ==============================================
    // ✅ JSON — PARSING UPDATE
    // ==============================================
    implementation 'org.json:json:20231013'

    // ==============================================
    // ✅ KOTLINX SERIALIZATION — RIWAYAT JSON
    // ==============================================
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2'

    // ==============================================
    // ✅ TESTING
    // ==============================================
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
