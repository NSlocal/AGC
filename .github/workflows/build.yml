name: Build & Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-22.04  # ✅ Pakai versi spesifik, hindari masalah versi baru
    timeout-minutes: 15     # ✅ Batas waktu, tidak nge-stuck selamanya

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafetyCore-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
