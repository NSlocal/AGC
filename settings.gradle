pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "SafetyCore"
include ':app'

// ==================================================
// KUNCI:
// - FAIL_ON_PROJECT_REPOS = mencegah duplikat repo
// - HANYA google() + mavenCentral() = cukup
// - include ':app' = wajib ada!
// ==================================================
